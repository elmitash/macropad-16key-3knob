    if(at && (at.kind==='key' || at.kind==='mouse' || at.kind==='media')){
      pickKey(code, MODNAMES[code]);
      return;
    }
    /* Nothing to fuse onto. Ctrl, Shift and Alt ARM: they are the three the
       device can carry on a mouse binding, so "Ctrl, then ホイール↑" must
       work on an empty key. Inserting a lone Ctrl chip instead loses it
       silently -- a mouse action REPLACES the sequence.

       Win and the right-hand four keep inserting: they cannot ride a mouse
       binding, so a lone press means the binding itself. */
    const ARMS_ALONE = [0xF1,0xF2,0xF3];
    if(!SEQ.length && !ARMS_ALONE.includes(code)){
      pickKey(code, MODNAMES[code]); return;
    }
  }
  ARMED=ARMED.includes(code) ? ARMED.filter(c=>c!==code)
                             : sortMods([...ARMED,code]);
  renderModRow();
  renderChips();   // the ghost chip at the caret follows the armed state
  // Shift changes what the character buttons say, so the board must follow
  if(code===0xF2) { PSHIFT=ARMED.includes(0xF2); renderBlocks(); }
  else renderBlocks();   // the mouse block's note names the armed modifier
}
/* Consume the armed modifiers: returns them and clears the row, so the same
   arming cannot leak into the pick after next. */
function takeArmed(){
  const a=ARMED;
  if(a.length){ ARMED=[]; PSHIFT=false; renderModRow(); renderBlocks(); renderChips(); }
  return a;
}
/* Armed modifiers with no key: a standalone modifier chip (Win by itself
   opens the Start menu). */
function insertArmedAlone(){
  const a=takeArmed(); if(!a.length) return false;
  for(const c of a) pickKey(c,MODNAMES[c]);
  return true;
}
function jumpTo(k){
  const el=$('#blk_'+k); if(!el) return;
  PBLOCKS.forEach(([t])=>$('#jm_'+t)?.classList.toggle('on',t===k));
  el.scrollIntoView({block:'start',behavior:'smooth'});
}
/* the panel header tells the user where the next pick lands, and shows the
   reselect banner when a chip is being swapped */
function syncPickerHead(){
  const m=$('#pkMode'); if(!m) return;
  if(POP_RESELECT>=0){
    m.classList.add('on');
    $('#pkModeText').textContent=CAT.t('pk.reselecting',{n:POP_RESELECT+1});
    $('#pkFor').textContent=CAT.t('pk.reselectNote');
  }else{
    m.classList.remove('on');
    /* Only the reselect banner: it is a MODE and nothing else says so. */
    $('#pkFor').textContent='';
  }
}
/* 文字・数字 tab. The grid is derived from META.chars, NEVER from HID key
   names: HID 0x30 is called "RBracket" while a JIS board types `[` with it.

   Shift is a TOGGLE over the whole grid, not a second set of buttons: a glyph
   and its shifted partner are the same physical key, and with the toggle on
   EVERY button costs 2 slots, which one banner states once. */
let PSHIFT=false;
function charGlyphs(shift){
  const map=shift?CHARSHIFT:CHARBASE;         // built from META.chars
  const letters=[],digits=[],syms=[];
  const seen=new Set();
  for(const [codeStr,ch] of Object.entries(map)){
    const code=+codeStr;
    if(ch===undefined||ch===null||ch==='') continue;
    if(seen.has(ch)) continue; seen.add(ch);
    if(code>=0x04&&code<=0x1D) letters.push([code,ch]);
    else if(code>=0x1E&&code<=0x27) digits.push([code,ch]);
    else syms.push([code,ch]);
  }
  const byCode=(a,b)=>a[0]-b[0];
  letters.sort(byCode);
  // 1..9 then 0 -- 0x27 is `0` and must read last, as it does on the board
  digits.sort(byCode);
  syms.sort(byCode);
  return {letters,digits,syms};
}
/* Shift is one state shared with the modifier row; this arms or disarms it
   there. */
function setPShift(on){
  const want=!!on;
  if(want!==ARMED.includes(0xF2)) toggleArm(0xF2);
}
/* one delegated handler: glyphs include ' " & < > which cannot be embedded
   safely in an inline onclick= (esc() does not escape quotes) */
function pgridClick(ev){
  const b=ev.target.closest('button[data-ch]');
  if(!b) return;
  pickChar(b.getAttribute('data-ch'));
}
/* Render all three blocks at once: the jump tabs move the viewport, they do
   not hide anything. Blocks the current sequence cannot accept are dimmed
   rather than removed. */
function renderBlocks(){
  const B=$('#pblocks'); if(!B) return;
  const special=isSpecial();
  const b=(lab,fn,cls='')=>`<button class="${cls}" onclick="${fn}">${esc(lab)}</button>`;
  const cb=ch=>`<button class="chbtn" data-ch="${esc(ch)
                 .replace(/"/g,'&quot;')}">${esc(ch)}</button>`;
  const grp=(title,list)=>list.length
    ? `<div class="pgroup"><span class="pglab">${title}</span>`
      +list.map(([,ch])=>cb(ch)).join('')+'</div>' : '';

  const {letters,digits,syms}=charGlyphs(PSHIFT);
  /* Headings name what the buttons PRODUCE, not the physical row: with Shift
     armed the number row types ! " #. */
  const digLab=CAT.t(PSHIFT?'pk.digitsShift':'pk.digits');
  const symLab=CAT.t(PSHIFT?'pk.symbolsShift':'pk.symbols');

  const nav=[['↑',0x52],['↓',0x51],['←',0x50],['→',0x4F],
    ['Home',0x4A],['End',0x4D],['PageUp',0x4B],['PageDown',0x4E],
    ['Insert',0x49],['Delete',0x4C],['Esc',0x29],['Tab',0x2B],
    ['Enter',0x28],['Backspace',0x2A],['Space',0x2C],['CapsLock',0x39],
    ['PrintScreen',0x46],['ScrollLock',0x47],['Pause',0x48]];
  const jis=[['ろ \_',0x87],['￥ ¥|',0x89],['かな',0x88],
             ['変換',0x8A],['無変換',0x8B],['半角/全角',0x35]];

  const keyBlock=
    /* No headings -- キーボード / マウス / メディア are in the fixed half
       above. The ids stay so the tabs can still jump here. */
    `<div class="pblock${special?' dim':''}" id="blk_key">`
    +`<div class="pblab">${esc(CAT.t('pk.keyboard'))}</div>`
    +(special?`<div class="pnote">${esc(CAT.t('pk.blockedSpecial'))}</div>`:'')
    +'<div class="pgrid" id="pgrid" data-testid="pgrid">'
    +'<div class="pnote">'+CAT.t('pk.charsNote')
    +(PSHIFT?CAT.t('pk.shiftCost'):'')+'</div>'
    +grp(CAT.t('pk.letters'),letters)+grp(digLab,digits)+grp(symLab,syms)
    +`<div class="pgroup"><span class="pglab">${esc(CAT.t('pk.navEdit'))}</span>`
    +nav.map(([n,c])=>b(n,`pickKey(${c},'${n}')`,'wide')).join('')+'</div>'
    +`<div class="pgroup"><span class="pglab">${esc(CAT.t('pk.fkeys'))}</span>`
    +Array.from({length:12},(_,i)=>{const n='F'+(i+13);
        return b(n,`pickKey(${0x68+i},'${n}')`);}).join('')+'</div>'
    +`<div class="pgroup"><span class="pglab">${esc(CAT.t('pk.jisKeys'))}</span>`
    +jis.map(([n,c])=>b(n,`pickKey(${c},'${n}')`,'wide')).join('')+'</div>'
    +'</div></div>';

  const mouseActions=CAT.mouseActions();
  const soloNote=`<div class="pnote">${esc(CAT.t('pk.soloNote'))}</div>`;
  /* Only Ctrl / Shift / Alt fit on the wire for a mouse action, hence naming
     them rather than saying "修飾". */
  /* How the user learns the modifier row reaches mouse actions at all. When
     something IS armed it names what will be attached instead. */
  const mouseMod=ARMED.length
    ? '<div class="pnote">'
      +CAT.t('pk.mouseArmed',{m:esc(ARMED.map(c=>MODNAMES[c]).join('+'))})
      +(ARMED.some(c=>!CAT.MOUSE_MOD_OK[c])?CAT.t('pk.mouseArmedDrop'):'')
      +'</div>'
    : `<div class="pnote">${CAT.t('pk.mouseHint')}</div>`;
  /* A rule and a quiet label, not a heading: without one the mouse and media
     buttons run together as one wall. */
  const blockLab=x=>`<div class="pblab">${esc(x)}</div>`;
  const mouseBlock=
    `<div class="pblock" id="blk_mouse">`+blockLab(CAT.t('pk.mouse'))+`<div class="pgrid">`
    +soloNote+mouseMod
    +mouseActions.map(a=>b(a.label,`pickSpecial('mouse','${a.name}')`,'wide')).join('')
    +'</div></div>';
  const mediaBlock=
    `<div class="pblock" id="blk_media">`+blockLab(CAT.t('pk.media'))+`<div class="pgrid">`
    +soloNote
    +CAT.mediaList().map(m=>b(m.label,`pickSpecial('media','${m.name}')`,'wide')).join('')
    +'</div></div>';

  B.innerHTML=keyBlock+mouseBlock+mediaBlock;
  B.onclick=pgridClick;
}

/* Both picker paths funnel through insertChip, so the fusion rule, dedup
   guards, standalone constraint and undo apply identically to the picker,
   to typing and to paste. */
function pickKey(code,label,mods){
  // a pending 「一覧から選び直す」 replaces the key in place, keeping mods+ms
  // (the chip's OWN mods win there by spec 9, so `mods` is an insert-only hint)
  if(POP_RESELECT>=0 && applyReselect('key',code,label)){
    takeArmed(); afterPick(); return;
  }
  POP_RESELECT=-1;                      // a dead index must never linger
  /* Whatever is armed applies to this pick and is then consumed. Armed
     modifiers merge: Ctrl armed + Shift picked gives Ctrl+Shift. */
  const armed=isMod(code)?[]:takeArmed();
  const row={kind:'key',code,label,ms:0,
             mods:sortMods([...new Set([...(mods||[]),...armed])])};
  if(hasSel()) replaceSelection(row); else insertChip(row,CARET);
  afterPick();
}
/* 文字・数字 tab: the button knows only the GLYPH. charToRow() is the single
   place that turns a glyph into {code,mods} via META.chars, so the JIS layout
   wins (`[` -> 0x30). Ends in pickKey -> insertChip. */
function pickChar(ch){
  const r=charToRow(ch);
  if(!r){ toast(CAT.t('toast.badChar',{c:ch})); return; }
  pickKey(r.code,ch,r.mods);
}
function pickSpecial(kind,name){
  /* A mouse action is three wire fields (button, wheel, modifier), not one
     code, so the chip carries the whole action. */
  if(kind==='mouse'){
    const a=CAT.MOUSE_ACTION_BY_NAME[String(name).toLowerCase()];
    if(!a) return pickSpecialNamed(kind,name);
    /* Where an armed modifier ends up is decided here, when the binding is
       built: the mod byte on a mouse action, an inline code on a keyboard
       key. Only ONE of Ctrl/Shift/Alt fits in that byte, so say what could
       not be carried rather than dropping it quietly. */
    const r=CAT.armMouse(a,ARMED);
    if(r.dropped.length){
      toast(CAT.t('toast.mouseModOne',
            {d:r.dropped.map(c=>MODNAMES[c]).join(', ')}));
      return;
    }
    takeArmed();          // consumed by this pick, exactly like a key pick
    return pickMouse(r.action);
  }
  return pickSpecialNamed(kind,name);
}
function pickMouse(a){
  if(ARMED.length){
    toast(CAT.t('toast.mouseNoMods'));
    return;
  }
  POP_RESELECT=-1;
  insertChip({kind:'mouse',code:a.buttons,label:a.label,ms:0,
              mouse:{buttons:a.buttons,wheel:a.wheel,mod:a.mod}});
  afterPick();
}
function pickSpecialNamed(kind,label){
  /* Media has nowhere to put a modifier -- the usage IS the whole binding --
     so refuse rather than silently drop an armed Ctrl. */
  if(ARMED.length){
    toast(CAT.t('toast.mediaNoMods'));
    return;
  }
  if(POP_RESELECT>=0 && applyReselect(kind,0,label)){
    afterPick(); return;
  }
  POP_RESELECT=-1;
  /* Resolve to the real usage and display name here, or a media chip reads
     "BassUp" while the button that made it says 低音＋. */
  const code=kind==='media' ? (CAT.MEDIA_BY_NAME[String(label).toLowerCase()]||0) : 0;
  const shown=kind==='media' && code ? CAT.mediaLabel(code) : label;
  insertChip({kind,code,label:shown,ms:0});
  afterPick();
}
/* the panel stays open: a pick clears the search box and returns the caret
   to the strip */
function afterPick(){
  POP_RESELECT=-1;
  $('#psearch').value=''; CANDS=[]; CSEL=0; renderCands('');
  renderBlocks();          // a special chip dims the keyboard block, and back
  syncPickerHead();
  focusStrip();
}

/* 他のキーへコピー (spec 11). Picks a target (+layer) and writes the SAME
   spec/delays there over the existing path -- no new wire format, no new
   insertion path.

   copyToPayload() is split out so the payload can be inspected without
   firing anything at the device. */
let CP_TARGET=null, CP_LAYER=1;

function copyTargets(){
  return (META.targets||[]).map(t=>typeof t==='string'?t:t.name);
}
function copyToPayload(target,layer){
  return {target,layer,spec:seqToSpec(),
          delays:flatten().map(s=>s.ms||0),delay:0};
}
window.copyToPayload=copyToPayload;

function openCopyTo(){
  const v=validateSeq();
  if(!v.ok){ msg(v.why,'err'); return; }
  closeChipPopover();
  CP_TARGET=null; CP_LAYER=LAYER;
  $('#cpFrom').textContent=CAT.t('cp.from',{k:SEL,L:LAYER});
  /* Show what the key will do, in the same words the chips use -- not the
     wire encoding. */
  const waits=flatten().filter(x=>x.ms>0).length;
  $('#cpPrev').textContent=SEQ.map(chipText).join(' \u2192 ')
    +(waits?CAT.t('cp.waits',{n:waits}):'');
  drawCopyTo();
  $('#cp').classList.add('open');
}
function closeCopyTo(){ const e=$('#cp'); if(e) e.classList.remove('open');
  CP_TARGET=null; }
function drawCopyTo(){
  $('#cpLayers').innerHTML=[1,2,3].map(n=>
    `<button class="${n===CP_LAYER?'on':''}" onclick="setCopyLayer(${n})">`
    +esc(CAT.t('pad.layer',{n}))+'</button>').join('');
  const mine=(n)=>n===SEL&&CP_LAYER===LAYER;
  $('#cpTargets').innerHTML=copyTargets().map(n=>
    `<button class="${n===CP_TARGET?'on':''}" ${mine(n)?'disabled':''}`
    +` data-testid="cptarget" onclick="setCopyTarget('${n}')"`
    +` title="${esc(n)}">${esc(n)}</button>`).join('');
  const go=$('#cpGo'); if(go) go.disabled=!CP_TARGET;
  $('#cpNote').textContent=CP_TARGET
    ? CAT.t('cp.targetIs',{k:CP_TARGET,L:CP_LAYER})
    : CAT.t('cp.pickTarget');
}
function setCopyLayer(n){ CP_LAYER=n;
  if(CP_TARGET===SEL&&n===LAYER) CP_TARGET=null;
  drawCopyTo(); }
function setCopyTarget(n){ CP_TARGET=n; drawCopyTo(); }
function doCopyTo(){
  if(!CP_TARGET) return;
  const v=validateSeq();
  if(!v.ok){ msg(v.why,'err'); return; }
  try{
    setDraft(MODEL.withBinding(DRAFT,seqToBinding(CP_TARGET,CP_LAYER)));
    msg(CAT.t('msg.copiedTo',{k:CP_TARGET,L:CP_LAYER}),'ok');
    closeCopyTo();
  }catch(e){ msg(e.message,'err'); }
}

/* saving. The chips become a binding object, not a string: flatten() already
   produces the wire order. seqToSpec survives only for the hex preview, which
   is a debug aid. */
function seqToSpec(){
  if(!SEQ.length) return '';
  if(SEQ[0].kind!=='key') return SEQ[0].label;
  return flatten().map(s=>'0x'+s.code.toString(16)).join('+');
}
/** The chips as the driver wants them: numeric key id, kind, codes, delays. */
function seqToBinding(targetName,layer){
  const keyId=CAT.nameToKeyId(targetName);
  if(keyId===null) throw new Error('unknown target: '+targetName);
  const head=SEQ[0];
  if(head&&head.kind==='mouse'){
    /* The chip carries the three wire fields directly, so nothing has to
       guess the wheel from label text that translation changes. */
    const m=head.mouse
      || CAT.MOUSE_ACTION_BY_NAME[String(head.label||'').toLowerCase()]
      || {buttons:head.code||0, wheel:0, mod:0};
    return {keyId,layer,kind:CAT.KIND_MOUSE,codes:[],delays:[],
            mouse:{mod:m.mod|0,buttons:m.buttons|0,wheel:m.wheel|0}};
  }
  if(head&&head.kind==='media'){
    const code=head.code||CAT.MEDIA_BY_NAME[(head.label||'').toLowerCase()]||0;
    return {keyId,layer,kind:CAT.KIND_MEDIA,codes:[code],delays:[0]};
  }
  const flat=flatten();
  return {keyId,layer,kind:CAT.KIND_KEYBOARD,
          codes:flat.map(x=>x.code), delays:flat.map(x=>x.ms||0)};
}
/* An edit lands in the draft, not on the pad: nothing here reaches hardware,
   so no device need be present. */
function saveSeq(){
  const v=validateSeq();
  if(!v.ok) return msg(v.why,'err');
  try{
    setDraft(MODEL.withBinding(DRAFT,seqToBinding(SEL,LAYER)));
    msg(CAT.t('msg.savedKey',{k:SEL}),'ok');
    closeEditor();
  }catch(e){ msg(e.message,'err'); }
}

/* LED */
const curMode=()=>META&&META.modes.find(x=>x.n==+$('#ledMode').value);
/* By mode number, not by what the dropdown shows: the write diff covers all
   three layers and two are not on screen. */
const modeTraits=n=>META&&META.modes.find(x=>x.n===(n|0));
/* The bar says which mode, what it does, and the 12 colours, so closing it
   is not a loss. `perKey` comes from LED_MODE_TRAITS: a mode that ignores the
   palette greys the strip rather than hiding it. */
function syncLedBar(){
  const m=curMode(), a=$('#ledarea');
  if(!a) return;
  a.dataset.mode = m?m.n:0;
  a.dataset.perkey = (!m||m.perKey)?'1':'0';
  $('#barName').textContent = m?m.label:'';
  $('#barWhy').textContent  = m?m.help:'';
  $('#barStrip').innerHTML = COLORS.slice(0,16).map(c=>
    `<i style="background:${c||'#000000'}"></i>`).join('');
  /* Dim is the look; disabled is the behaviour. pointer-events:none stops the
     mouse but not the keyboard, and a tab-focused colour input would still
     stage a colour the pad throws away. */
  const noCol = !!(m && !m.perKey);
  $('#ledWhy').textContent = noCol ? (m.noColor||'') : '';
  $('#ledColors').querySelectorAll('input,button').forEach(el=>{
    el.disabled = noCol; });
  /* The pad shows the mode, not just the colours -- see the CSS. The flag on
     .device is separate from the mode number so the case does not repeat the
     catalog's list of animated modes. */
  const K=$('#keys'); if(K) K.dataset.mode = m?m.n:0;
  $('.device').classList.toggle('animated', !!(m&&m.animated));
  syncPadHint();
  syncLedTarget();
}
/* Which keys the next swatch click paints. Reads SEL, the same selection the
   pad and the editor use. */
function syncLedTarget(){
  const t=$('#ledTarget'); if(!t) return;
  const btnKey = $('#applyKeyBtn');
  const m=SEL&&SEL.match(/^key(\\d+)$/);
  if(m){
    const keyNum = +m[1];
    const e=byName(SEL), lab=e&&e.label!=='NULL'?e.label:'';
    const qStr = lab ? ' ('+esc(lab)+')' : '';
    t.innerHTML = CAT.t('led.targetOne', { n: keyNum, q: qStr });
    if(btnKey) {
      btnKey.style.display = '';
      btnKey.textContent = CAT.t('led.applyKey', { n: keyNum });
    }
    if(COLORS[keyNum - 1] && COLORS[keyNum - 1] !== '#000000') {
      $('#ledAll').value = COLORS[keyNum - 1];
    }
  } else {
    t.innerHTML = CAT.t('led.targetAll');
    if(btnKey) btnKey.style.display = 'none';
  }
}
/* Open/closed is a standing preference. Storage access itself throws when the
   browser has site data switched off, so both directions are guarded. */
const LED_OPEN_KEY='macropad.ledOpen';
function ledAreaOpen(open){
  applyLedOpen(open);
  try{ localStorage.setItem(LED_OPEN_KEY,open?'1':'0'); }catch{ /* no store */ }
}
/* Two things speak through the one line under the pad: what a key click does,
   and how to preview the light. Both callers go through here or whoever wrote
   last wins. Click meaning comes first. */
function syncPadHint(){
  const open=$('#ledarea').classList.contains('open'), m=curMode();
  $('#padHint').textContent = open
    ? CAT.t('pad.hintPaint')
    : (m&&(m.n===2||m.n===3)) ? CAT.t('pad.hintHover') : CAT.t('pad.hint');
}
/* A key click means two different things depending on this, so the hint must
   say which is live -- otherwise opening the palette silently rewires the
   pad. */
function applyLedOpen(open){
  $('#ledarea').classList.toggle('open',open);
  $('#ledbar').setAttribute('aria-expanded',open?'true':'false');
  syncPadHint();
  if(!open&&SEL&&/^key\d+$/.test(SEL)&&!$('#ov').classList.contains('open')){
    SEL=null; render();               // a paint target outlives nothing
  }
  syncLedTarget();
}
function toggleLedArea(){ ledAreaOpen(!$('#ledarea').classList.contains('open')); }
function restoreLedArea(){
  let v=null;
  try{ v=localStorage.getItem(LED_OPEN_KEY); }catch{ /* no store */ }
  applyLedOpen(v==='1');
}
/* Colour edits go into the draft like any other edit, so they survive a
   reload and are visible to the write button. */
function commitColors(){
  const mode=+$('#ledMode').value, t=modeTraits(mode);
  /* Switching into a mode that ignores colour must NOT restage the colours:
     the pad keeps reporting whatever was last written to it, so a different
     set here leaves draft and device permanently unequal and the write button
     lit for a change no write can settle. COLORS is untouched, so the palette
     returns intact when a colour mode is chosen again. */
  const keep = t && !t.perKey && DEVICE && DEVICE.leds && DEVICE.leds[LAYER];
  setDraft(MODEL.withLeds(DRAFT,LAYER,mode,
    keep ? keep.colors.slice(0,16) : COLORS.slice(0,16)));
}
/* The gate, in one place. The swatches are <i> elements with inline handlers,
   so `disabled` does not apply and CSS pointer-events is only a look. */
function colorsUsed(){ const m=curMode(); return !m || m.perKey; }
function useSwatch(hex){
  const modeSelect = $('#ledMode');
  if (modeSelect && +modeSelect.value === 0) modeSelect.value = 1;
  const m=SEL&&SEL.match(/^key(\\d+)$/);
  if(m) {
    COLORS[+m[1]-1]=hex;
    msg(CAT.t('led.msgAppliedKey', { n: m[1], c: hex }), 'ok');
  } else {
    for(let i=0;i<16;i++) COLORS[i]=hex;
  }
  $('#ledAll').value=hex;
  commitColors();
}
function applySelectedKey(){
  const m=SEL&&SEL.match(/^key(\\d+)$/);
  if(!m){
    return;
  }
  const modeSelect = $('#ledMode');
  if (modeSelect && +modeSelect.value === 0) modeSelect.value = 1;
  const c=$('#ledAll').value;
  const keyIdx = +m[1] - 1;
  COLORS[keyIdx] = c;
  commitColors();
  msg(CAT.t('led.msgAppliedKey', { n: m[1], c }), 'ok');
}
function onCustomColorInput(hex){
  const m=SEL&&SEL.match(/^key(\\d+)$/);
  if(m){
    const modeSelect = $('#ledMode');
    if (modeSelect && +modeSelect.value === 0) modeSelect.value = 1;
    COLORS[+m[1] - 1] = hex;
    commitColors();
  }
}
function applyAll(){
  const modeSelect = $('#ledMode');
  if (modeSelect && +modeSelect.value === 0) modeSelect.value = 1;
  const c=$('#ledAll').value;
  for(let i=0;i<16;i++) COLORS[i]=c;
  commitColors();
  msg(CAT.t('led.msgAppliedAll', { c }), 'ok');
}
function applyRandomColors(){
  const modeSelect = $('#ledMode');
  if (modeSelect && +modeSelect.value === 0) modeSelect.value = 1;

  // 1. 16개의 완전히 구별되는 고유 색조(Hue) 생성 (360도를 16등분하여 중복 0%)
  const baseOffset = Math.floor(Math.random() * 360);
  const uniqueHues = [];
  for (let i = 0; i < 16; i++) {
    uniqueHues.push((baseOffset + Math.floor(i * (360 / 16))) % 360);
  }

  // 2. 피셔-예이츠 셔플(Fisher-Yates Shuffle)로 16개 색상을 완벽하게 뒤섞음
  for (let i = uniqueHues.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = uniqueHues[i];
    uniqueHues[i] = uniqueHues[j];
    uniqueHues[j] = tmp;
  }

  // 3. 섞인 16개 서로 다른 고유 색상을 각 키에 1개씩만 배정
  for (let i = 0; i < 16; i++) {
    const h = uniqueHues[i];
    const s = 0.95;
    const l = 0.52;
    const c = (1 - Math.abs(2 * l - 1)) * s;
    const x = c * (1 - Math.abs((h / 60) % 2 - 1));
    const m = l - c / 2;
    let r = 0, g = 0, b = 0;
    if (h < 60) { r = c; g = x; }
    else if (h < 120) { r = x; g = c; }
    else if (h < 180) { g = c; b = x; }
    else if (h < 240) { g = x; b = c; }
    else if (h < 300) { r = x; b = c; }
    else { r = c; b = x; }
    const toHex = v => Math.round((v + m) * 255).toString(16).padStart(2, '0');
    COLORS[i] = '#' + toHex(r) + toHex(g) + toHex(b);
  }
  commitColors();
  msg(CAT.t('led.msgRandom'), 'ok');
}
/* The LED mode is in the same record as the colours, so changing it is an
   edit, not just a help-text change. */
function onLedMode(){ commitColors(); }   // commitColors -> refresh -> syncLedBar
/* Aim the palette at one key, using the same SEL the editor and pad read.
   Clicking the selected key again aims back at all twelve. */
function pickForPaint(n){
  SEL = SEL===n ? null : n;
  render(); syncLedTarget();
}
/* writing. One button, at the end, for everything: the diff is the work list
   and it is written in one run. The run is shown first, because it is the
   only irreversible thing on the page. */
function openWrite(){
  /* Recompute rather than trust the cached PENDING: this is the one place
     where being wrong writes to hardware. */
  PENDING = DRAFT ? MODEL.diff(DRAFT,DEVICE) : {count:0,bindings:[],leds:[]};
  if(!PAD){ msg(CAT.t('msg.noDevice'),'err'); return; }
  const d=PENDING;
  if(!d.count){ msg(CAT.t('msg.sameAsDevice'),'ok'); return; }
  $('#wrSub').textContent=CAT.t('wr.sub',{n:d.count});
  $('#wrList').innerHTML=describeDiff(d);
  /* The device needs WRITE_GAP + COMMIT_GAP per item; a user told nothing
     pulls the cable. */
  const secs=Math.ceil(d.count*1.1);
  $('#wrNote').textContent=CAT.t('wr.note',{s:secs});
  $('#wrGo').disabled=false;
  $('#wr').classList.add('open');
}
function closeWrite(){ $('#wr').classList.remove('open'); }
function writeAll(){ openWrite(); }
/** The work list in words -- a count alone does not say whether this is what
 *  the user meant. */
function describeDiff(d){
  const out=[];
  for(const b of d.bindings){
    const name=CAT.keyIdToName(b.keyId);
    const cur=(b.binding.codes||[]).length||b.binding.mouse
      ? describe(b.binding.kind,b.binding.codes||[],b.binding.mouse)
      : CAT.t('wr.none');
    out.push('<div>'+CAT.t('wr.diffRow',
      {L:b.layer,k:esc(name),v:esc(cur)})+'</div>');
  }
  /* A mode that ignores the palette still sends colours -- writeLeds carries
     mode and colours in one packet -- but sends them unchanged, staged from
     the device by commitColors. So the line says the colours stay as they
     are, not that they are withheld. */
  for(const L of d.leds){
    const md=DRAFT&&DRAFT.leds&&DRAFT.leds[L], t=md&&modeTraits(md.mode);
    if(t&&!t.perKey){
      out.push('<div>'+CAT.t('wr.ledModeOnly',{L})+'</div>'
        +`<div class="quiet">${esc(CAT.t('wr.ledModeOnlyNote'))}</div>`);
    }else out.push('<div>'+CAT.t('wr.ledBoth',{L})+'</div>');
  }
  return out.join('');
}
async function doWrite(){
  const d=PENDING;
  if(!PAD||!d.count) return closeWrite();
  $('#wrGo').disabled=true;
  let done=0;
  /* A write takes seconds and re-reads the pad at the end. A connect or
     reload landing mid-write would reconcile against a half-written pad and
     could raise a conflict dialog. Hold the same flag a read holds. */
  WRITING=true; READING=true; publish();
  try{
    for(const b of d.bindings){
      $('#wrSub').textContent=CAT.t('wr.progress',{i:done+1,n:d.count});
      await PAD.writeBinding({...b.binding,layer:b.layer});
      done++;
    }
    for(const L of d.leds){
      $('#wrSub').textContent=CAT.t('wr.progress',{i:done+1,n:d.count});
      const led=DRAFT.leds[L]||{mode:0,colors:[]};
      const rgb=Array.from({length:16},(_,i)=>fromHex(led.colors[i]||'#000000'));
      await PAD.writeLeds(L,led.mode|0,rgb);
      done++;
    }
    closeWrite();
    /* Read the pad back rather than assume the write took, so the button
       lights again for exactly what is missing.

       The read cannot follow the last commit immediately. Measured on the
       device: a read issued right after the final COMMIT_GAP still answers
       with the pre-write values, so a correct write reads as "not
       reflected". Let it settle, then read. */
    $('#wrSub').textContent=CAT.t('wr.verifying');
    await D_SLEEP(SETTLE_AFTER_WRITE);
    DEVICE=MODEL.toPlain(await PAD.readAll());
    refresh();
    msg(PENDING.count
      ? CAT.t('wr.partial',{n:done,p:PENDING.count})
      : CAT.t('wr.done',{n:done}), PENDING.count?'err':'ok');
  }catch(e){
    closeWrite();
    /* A failed run leaves the pad half-written, so re-read the baseline and
       let the diff say what is left. */
    try{ DEVICE=MODEL.toPlain(await PAD.readAll()); }catch{ DEVICE=null; }
    refresh();
    msg(CAT.t('wr.failed',{n:done,e:e.message}),'err');
  }finally{
    /* refresh() ran in both paths with the flags still set, so the button
       shows "reading". Clear them and redraw once more. */
    WRITING=false; READING=false; refresh();
  }
}
/** Throw away the design and take what the pad holds. */
function revertToDevice(){
  if(!DEVICE){ msg(CAT.t('msg.notRead'),'err'); return; }
  setDraft(MODEL.cloneConfig(DEVICE));
  msg(CAT.t('msg.reverted'),'ok');
}

/* the connect-time conflict */
function openConflict(d){
  $('#cfList').innerHTML='<div>'+CAT.t('cf.count',{n:d.count})+'</div>'
    +describeDiff(d);
  $('#cf').classList.add('open');
}
function resolveConflict(which){
  $('#cf').classList.remove('open');
  if(which==='device'){
    setDraft(MODEL.cloneConfig(DEVICE));
    msg(CAT.t('msg.loaded'),'ok');
  }else{
    refresh();
    msg(CAT.t('msg.keptDraft'),'ok');
  }
}

/* export and import. Two exports, because "save what I have" can mean the
   design on screen or the pad's actual contents, and they may differ. */
function toggleMenu(e){
  const m=e.currentTarget.parentElement;
  m.classList.toggle('open');
  /* Registered after this click, or the click that opened it closes it. */
  if(m.classList.contains('open')){
    setTimeout(()=>document.addEventListener('click',
      function off(){ m.classList.remove('open');
        document.removeEventListener('click',off); },{once:true}),0);
  }
}
function download(obj,name){
  const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  a.click(); URL.revokeObjectURL(a.href);
}
/* Down to the second: two exports within a minute would otherwise share a
   filename, which the browser resolves by silently appending (1). */
function stamp(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`
        +`-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}

function applyPlanAPreset(){
  if(!DRAFT){ DRAFT=MODEL.emptyConfig(); }

  // 1. Layer 1:
  // Keys 1..12: F13..F24 (0x68 .. 0x73)
  for(let i=1; i<=12; i++){
    const fcode = 0x68 + (i - 1);
    DRAFT = MODEL.withBinding(DRAFT, { keyId: i, layer: 1, kind: 1, codes: [fcode], delays: [0] });
  }
  // Keys 13..16: Shift + F13..F16 (0xF2, 0x68 .. 0x6B)
  for(let i=13; i<=16; i++){
    const fcode = 0x68 + (i - 13);
    DRAFT = MODEL.withBinding(DRAFT, { keyId: i, layer: 1, kind: 1, codes: [0xF2, fcode], delays: [0, 0] });
  }
  // Knobs 1..3: Shift + F17..F24, Ctrl+Shift+F13
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 17, layer: 1, kind: 1, codes: [0xF2, 0x68 + 4], delays: [0, 0] }); // Shift+F17
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 18, layer: 1, kind: 1, codes: [0xF2, 0x68 + 5], delays: [0, 0] }); // Shift+F18
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 19, layer: 1, kind: 1, codes: [0xF2, 0x68 + 6], delays: [0, 0] }); // Shift+F19
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 20, layer: 1, kind: 1, codes: [0xF2, 0x68 + 7], delays: [0, 0] }); // Shift+F20
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 21, layer: 1, kind: 1, codes: [0xF2, 0x68 + 8], delays: [0, 0] }); // Shift+F21
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 22, layer: 1, kind: 1, codes: [0xF2, 0x68 + 9], delays: [0, 0] }); // Shift+F22
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 23, layer: 1, kind: 1, codes: [0xF2, 0x68 + 10], delays: [0, 0] }); // Shift+F23
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 24, layer: 1, kind: 1, codes: [0xF2, 0x68 + 11], delays: [0, 0] }); // Shift+F24
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 25, layer: 1, kind: 1, codes: [0xF1, 0xF2, 0x68], delays: [0, 0, 0] }); // Ctrl+Shift+F13

  // 2. Layer 2:
  // Keys 1..12: Ctrl + F13..F24 (0xF1, 0x68 .. 0x73)
  for(let i=1; i<=12; i++){
    const fcode = 0x68 + (i - 1);
    DRAFT = MODEL.withBinding(DRAFT, { keyId: i, layer: 2, kind: 1, codes: [0xF1, fcode], delays: [0, 0] });
  }
  // Keys 13..16: Ctrl + Shift + F14..F17 (0xF1, 0xF2, 0x68+1 .. 0x68+4)
  for(let i=13; i<=16; i++){
    const fcode = 0x68 + (i - 12);
    DRAFT = MODEL.withBinding(DRAFT, { keyId: i, layer: 2, kind: 1, codes: [0xF1, 0xF2, fcode], delays: [0, 0, 0] });
  }
  // Knobs 1..3: Ctrl + Shift + F18..F24, Ctrl+Alt+F13, Ctrl+Alt+F14
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 17, layer: 2, kind: 1, codes: [0xF1, 0xF2, 0x68 + 5], delays: [0, 0, 0] }); // Ctrl+Shift+F18
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 18, layer: 2, kind: 1, codes: [0xF1, 0xF2, 0x68 + 6], delays: [0, 0, 0] }); // Ctrl+Shift+F19
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 19, layer: 2, kind: 1, codes: [0xF1, 0xF2, 0x68 + 7], delays: [0, 0, 0] }); // Ctrl+Shift+F20
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 20, layer: 2, kind: 1, codes: [0xF1, 0xF2, 0x68 + 8], delays: [0, 0, 0] }); // Ctrl+Shift+F21
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 21, layer: 2, kind: 1, codes: [0xF1, 0xF2, 0x68 + 9], delays: [0, 0, 0] }); // Ctrl+Shift+F22
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 22, layer: 2, kind: 1, codes: [0xF1, 0xF2, 0x68 + 10], delays: [0, 0, 0] }); // Ctrl+Shift+F23
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 23, layer: 2, kind: 1, codes: [0xF1, 0xF2, 0x68 + 11], delays: [0, 0, 0] }); // Ctrl+Shift+F24
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 24, layer: 2, kind: 1, codes: [0xF1, 0xF3, 0x68], delays: [0, 0, 0] }); // Ctrl+Alt+F13
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 25, layer: 2, kind: 1, codes: [0xF1, 0xF3, 0x68 + 1], delays: [0, 0, 0] }); // Ctrl+Alt+F14

  // 3. Layer 3:
  // Keys 1..12: Alt + F13..F24 (0xF3, 0x68 .. 0x73)
  for(let i=1; i<=12; i++){
    const fcode = 0x68 + (i - 1);
    DRAFT = MODEL.withBinding(DRAFT, { keyId: i, layer: 3, kind: 1, codes: [0xF3, fcode], delays: [0, 0] });
  }
  // Keys 13..16: Alt + Shift + F13..F16 (0xF3, 0xF2, 0x68 .. 0x6B)
  for(let i=13; i<=16; i++){
    const fcode = 0x68 + (i - 13);
    DRAFT = MODEL.withBinding(DRAFT, { keyId: i, layer: 3, kind: 1, codes: [0xF3, 0xF2, fcode], delays: [0, 0, 0] });
  }
  // Knobs 1..3: Alt + Shift + F17..F24, Ctrl+Alt+Shift+F13
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 17, layer: 3, kind: 1, codes: [0xF3, 0xF2, 0x68 + 4], delays: [0, 0, 0] }); // Alt+Shift+F17
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 18, layer: 3, kind: 1, codes: [0xF3, 0xF2, 0x68 + 5], delays: [0, 0, 0] }); // Alt+Shift+F18
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 19, layer: 3, kind: 1, codes: [0xF3, 0xF2, 0x68 + 6], delays: [0, 0, 0] }); // Alt+Shift+F19
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 20, layer: 3, kind: 1, codes: [0xF3, 0xF2, 0x68 + 7], delays: [0, 0, 0] }); // Alt+Shift+F20
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 21, layer: 3, kind: 1, codes: [0xF3, 0xF2, 0x68 + 8], delays: [0, 0, 0] }); // Alt+Shift+F21
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 22, layer: 3, kind: 1, codes: [0xF3, 0xF2, 0x68 + 9], delays: [0, 0, 0] }); // Alt+Shift+F22
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 23, layer: 3, kind: 1, codes: [0xF3, 0xF2, 0x68 + 10], delays: [0, 0, 0] }); // Alt+Shift+F23
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 24, layer: 3, kind: 1, codes: [0xF3, 0xF2, 0x68 + 11], delays: [0, 0, 0] }); // Alt+Shift+F24
  DRAFT = MODEL.withBinding(DRAFT, { keyId: 25, layer: 3, kind: 1, codes: [0xF1, 0xF3, 0xF2, 0x68], delays: [0, 0, 0, 0] }); // Ctrl+Alt+Shift+F13

  setDraft(DRAFT);
  msg(CAT.t('msg.planAApplied'), 'ok');
}

function clearAllCurrentLayer(){
  if(!confirm(CAT.t('msg.confirmClear').replace(/\\n/g, '\n'))) return;
  if(!DRAFT) DRAFT=MODEL.emptyConfig();
  for(let i=1;i<=25;i++){
    DRAFT=MODEL.withBinding(DRAFT,LAYER,i,{
      keyId:i,layer:LAYER,kind:1,codes:[],delays:[]
    });
  }
  setDraft(DRAFT);
  msg(CAT.t('msg.layerCleared'), 'ok');
}

function switchLanguage(lang){
  CAT.setLang(lang);
  applyCurrentLang();
}

function applyCurrentLang(){
  const cur = CAT.LANG;
  const labels = { ko: '한국어', en: 'English', ja: '日本語' };
  const el = $('#currentLangLabel');
  if (el) el.textContent = labels[cur] || cur;
  if (typeof document !== 'undefined' && document.documentElement) {
    document.documentElement.lang = cur;
  }

  // 1. Apply string table to data-i18n elements
  applyI18n();

  // 2. Re-render layer buttons with translated label
  const lbContainer = $('#layerBtns');
  if (lbContainer && typeof LAYER !== 'undefined') {
    lbContainer.innerHTML = [1, 2, 3].map(n =>
      `<button id="lb${n}" class="${LAYER === n ? 'on' : ''}" onclick="setLayer(${n})">${esc(CAT.t('pad.layer', { n }))}</button>`
    ).join('');
  }

  // 3. Re-render LED mode select options
  if (typeof META !== 'undefined' && META) {
    META.modes = CAT.ledModeList();
    META.wireless = CAT.wirelessNote();
  }
  const modeSelect = $('#ledMode');
  if (modeSelect) {
    const curVal = modeSelect.value;
    modeSelect.innerHTML = '';
    const modes = CAT.ledModeList();
    modes.forEach(m => modeSelect.add(new Option(m.n + ' — ' + (m.label || m.name), m.n)));
    modeSelect.value = curVal;
  }

  // 4. Update pad hint & wireless warning note
  if (typeof syncPadHint === 'function') syncPadHint();
  else {
    const hintEl = $('#padHint');
    if (hintEl) hintEl.innerHTML = CAT.t('pad.hint');
  }
  const wireEl = $('#wirelessNote');
  if (wireEl) wireEl.textContent = CAT.wirelessNote();

  // 5. Update LED bar & LED target text
  if (typeof syncLedBar === 'function') syncLedBar();
  if (typeof syncLedTarget === 'function') syncLedTarget();
  if (typeof refresh === 'function') refresh();
}

function exportApp(){
  if(!DRAFT) return msg(CAT.t('msg.nothingToSave'),'err');
  download(MODEL.toExport(DRAFT,'app',{at:new Date().toISOString()}),
           `macropad-app-${stamp()}.json`);
  msg(CAT.t('msg.exportedApp'),'ok');
}
/** The pad's own contents, read fresh -- not the baseline, which could be
 *  minutes old. */
async function exportDevice(){
  if(!PAD) return msg(CAT.t('msg.noDevice'),'err');
  try{
    msg(CAT.t('msg.readingDevice'),'');
    const cfg=MODEL.toPlain(await PAD.readAll());
    DEVICE=cfg; syncWrite();
    download(MODEL.toExport(cfg,'device',
      {at:new Date().toISOString(),device:PAD.name}),
      `macropad-device-${stamp()}.json`);
    msg(CAT.t('msg.exportedDevice'),'ok');
  }catch(e){ msg(CAT.t('msg.readFail',{e:e.message}),'err'); }
}
async function importFile(e){
  const f=e.target.files&&e.target.files[0];
  e.target.value='';                       // so the same file can be picked twice
  if(!f) return;
  try{
    const r=MODEL.fromExport(JSON.parse(await f.text()));
    if(!r.ok) return msg(r.why,'err');
    setDraft(r.config);
    msg(CAT.t(PAD?'msg.importedWrite':'msg.imported'),'ok');
  }catch(err){ msg(CAT.t('msg.importFail',{e:err.message}),'err'); }
}
$('#ov').onclick=e=>{if(e.target.id==='ov')closeEditor();};
$('#cp').onclick=e=>{if(e.target.id==='cp')closeCopyTo();};
$('#wr').onclick=e=>{if(e.target.id==='wr')closeWrite();};
/* The conflict dialog deliberately has no click-outside and no cancel:
   dismissing it would leave the page in neither state. */
/* A reminder, not a guard: the design is in localStorage either way. */
window.addEventListener('beforeunload',e=>{
  if(PENDING&&PENDING.count&&PAD){ e.preventDefault(); e.returnValue=''; }
});
/* boot() is async and nothing awaits it, so a throw inside would vanish
   silently and the page would just look slow. */
boot().catch(e=>{
  console.error('boot failed', e);
  msg((CAT && CAT.t ? CAT.t('msg.startFail',{e:e.message}) : ('초기화 실패: ' + e.message)),'err');
});
